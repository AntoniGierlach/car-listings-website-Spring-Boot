spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/apexwheels;MODE=MySQL;NON_KEYWORDS=USER;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
app.demo-data.enabled=true
# Set spring.datasource.driver-class-name to com.mysql.cj.jdbc.Driver when using MySQL.
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
spring.web.locale=pl_PL
spring.web.locale-resolver=accept-header
server.error.whitelabel.enabled=false
